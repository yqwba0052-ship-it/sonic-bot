name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install fastapi "uvicorn[standard]" httpx pytest pytest-asyncio ruff
      - run: ruff check .
      - run: pytest -q

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint src
      - run: npx expo prebuild --platform android --no-install
        env:
          CI: "1"
      - name: Build APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          signing=()
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/sonic.jks"
            signing=(
              -Pandroid.injected.signing.store.file="$RUNNER_TEMP/sonic.jks"
              -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD"
              -Pandroid.injected.signing.key.alias=sonic
              -Pandroid.injected.signing.key.password="$KEYSTORE_PASSWORD"
            )
          else
            echo "::warning::No KEYSTORE_BASE64 secret; the APK uses the debug signing key."
          fi
          cd android
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,x86_64 "${signing[@]}"
      - uses: actions/upload-artifact@v5
        with:
          name: sonic-apk
          path: app/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
