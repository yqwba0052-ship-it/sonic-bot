name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install fastapi "uvicorn[standard]" httpx pytest pytest-asyncio ruff
      - run: ruff check .
      - run: pytest -q

  research:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install numpy pytest ruff fastapi httpx pydantic
      - run: ruff check .
      - run: pytest -q

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    outputs:
      number: ${{ steps.version.outputs.number }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - name: Next version (v1.0.1, v1.0.2, ...)
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh release list --repo "${{ github.repository }}" --limit 100 \
                   --json tagName --jq '.[].tagName' \
                 | grep -E '^v1\.0\.[0-9]+$' | sed 's/^v1\.0\.//' | sort -n | tail -1)
          next=$(( ${last:-0} + 1 ))
          echo "number=$next" >> "$GITHUB_OUTPUT"
          echo "tag=v1.0.$next" >> "$GITHUB_OUTPUT"
          echo "Building v1.0.$next"
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint src
      - name: Version inside the app (each release installs over the previous one)
        run: |
          node -e '
            const fs = require("fs");
            const config = JSON.parse(fs.readFileSync("app.json", "utf8"));
            config.expo.version = "1.0.${{ steps.version.outputs.number }}";
            config.expo.android.versionCode = ${{ steps.version.outputs.number }} + 1;
            fs.writeFileSync("app.json", JSON.stringify(config, null, 2));
          '
      - run: npx expo prebuild --platform android --no-install
        env:
          CI: "1"
      - name: Build APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          signing=()
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/sonic.jks"
            signing=(
              -Pandroid.injected.signing.store.file="$RUNNER_TEMP/sonic.jks"
              -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD"
              -Pandroid.injected.signing.key.alias=sonic
              -Pandroid.injected.signing.key.password="$KEYSTORE_PASSWORD"
            )
          else
            echo "::warning::No KEYSTORE_BASE64 secret; the APK uses the debug signing key."
          fi
          cd android
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,x86_64 "${signing[@]}"
      - uses: actions/upload-artifact@v5
        with:
          name: sonic-apk
          path: app/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  release:
    # Like the Nokhba app: every push to main that passes all checks publishes the APK.
    needs: [server, research, android]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: sonic-apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv app-release.apk sonic.apk
          gh release create "${{ needs.android.outputs.tag }}" sonic.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "سونيك ${{ needs.android.outputs.tag }}" \
            --notes "نسخة أندرويد مبنية تلقائياً من ${{ github.sha }}. حمّل sonic.apk وثبّته على هاتفك. التطبيق يتحكم في البوت على اللابتوب (وضع وهمي أو تجريبي فقط، بدون أموال حقيقية)."
